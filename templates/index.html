<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول روابط ميديا فاير</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; text-align: center; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            display: none;
        }
        .result.show { display: block; }
        .result a {
            color: #667eea;
            word-break: break-all;
            display: block;
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #667eea;
        }
        .error { color: #e74c3c; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 محول روابط ميديا فاير</h1>
        <p style="text-align:center;color:#666;">أدخل رابط ميديا فاير لتحصل على رابط مخصص</p>
        
        <form method="POST">
            <input type="url" name="url" placeholder="https://www.mediafire.com/file/..." required>
            <button type="submit">🚀 تحويل الرابط</button>
        </form>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <div class="result {% if success %}show{% endif %}">
            <strong>✅ تم إنشاء صفحتك!</strong>
            <p style="font-size:14px;">انسخ هذا الرابط وشاركه:</p>
            <a href="{{ page_url }}" target="_blank">{{ page_url }}</a>
        </div>
    </div>
</body>
    </html>
