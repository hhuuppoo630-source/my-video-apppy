<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول روابط ميديا فاير</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="url"]:focus {
            border-color: #667eea;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result a {
            color: #667eea;
            word-break: break-all;
            display: block;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            text-decoration: none;
            border: 1px solid #667eea;
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
            text-align: center;
        }
        .copy-btn {
            background: #27ae60;
            margin-top: 10px;
        }
        .copy-btn:hover {
            background: #2ecc71;
        }
        .footer {
            text-align: center;
            color: #999;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 محول روابط ميديا فاير</h1>
        <p>أدخل رابط ميديا فاير لتحصل على رابط صفحة مخصصة للتشغيل</p>
        
        <form method="POST">
            <input type="url" name="url" placeholder="https://www.mediafire.com/file/..." required>
            <button type="submit">🚀 تحويل الرابط</button>
        </form>
        
        <div class="result {% if success %}show{% endif %}" id="result">
            <strong>✅ تم إنشاء صفحتك!</strong>
            <p style="margin-top: 10px; font-size: 14px;">انسخ هذا الرابط وشاركه مع المستخدمين:</p>
            <a href="{{ page_url }}" target="_blank" id="pageLink">{{ page_url }}</a>
            <button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>
            <div class="error" style="display: none;" id="copyMsg">تم النسخ! ✅</div>
        </div>
        
        <div class="footer">⚡ صفحة مخصصة لكل رابط • تنتهي صلاحيتها بعد 30 دقيقة</div>
    </div>

    <script>
        function copyLink() {
            const link = document.getElementById('pageLink').href;
            navigator.clipboard.writeText(link).then(() => {
                const msg = document.getElementById('copyMsg');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 2000);
            });
        }
    </script>
</body>
</html>
